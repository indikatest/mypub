<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Markdown Rendering Test — Microsoft Calculator</title>

<!-- GitHub Markdown CSS only. No custom CSS. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown.min.css">

</head>
<body>

<article class="markdown-body" id="readme">
    Loading GitHub-rendered README...
</article>

<script>
const OWNER = "microsoft";
const REPO = "calculator";
const BRANCH = "main";

async function getJSON(url) {
    const response = await fetch(url, {
        headers: {
            "Accept": "application/vnd.github+json"
        }
    });

    if (!response.ok) {
        throw new Error("GitHub API error: " + response.status);
    }

    return response.json();
}

function decodeBase64UTF8(value) {
    const binary = atob(value.replace(/\s/g, ""));
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
}

function resolveREADMEAssets(root) {
    const base =
        `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/`;

    // GitHub's Markdown renderer returns relative image/link paths.
    // Resolve relative image URLs against the repository root.
    root.querySelectorAll("img").forEach(img => {
        const src = img.getAttribute("src");
        if (!src) return;

        if (!/^(https?:|data:|blob:)/i.test(src)) {
            img.src = new URL(src, base).href;
        }
    });

    // Also resolve relative links where possible.
    root.querySelectorAll("a").forEach(a => {
        const href = a.getAttribute("href");
        if (!href || href.startsWith("#")) return;

        if (!/^(https?:|mailto:|data:)/i.test(href)) {
            a.href =
                `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/` +
                href.replace(/^\.?\//, "");
        }
    });
}

async function loadREADME() {
    const readmeElement = document.getElementById("readme");

    try {
        // 1. Get the actual README.md.
        const readme = await getJSON(
            `https://api.github.com/repos/${OWNER}/${REPO}/readme?ref=${BRANCH}`
        );

        const markdown = decodeBase64UTF8(readme.content);

        // 2. Let GitHub render the Markdown.
        const response = await fetch("https://api.github.com/markdown", {
            method: "POST",
            headers: {
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: markdown,
                mode: "gfm",
                context: `${OWNER}/${REPO}`
            })
        });

        if (!response.ok) {
            throw new Error(
                "GitHub Markdown API error: " + response.status
            );
        }

        readmeElement.innerHTML = await response.text();

        // 3. Make README images such as
        //    docs/Images/CalculatorScreenshot.png
        //    point to the repository's raw content.
        resolveREADMEAssets(readmeElement);

    } catch (error) {
        readmeElement.textContent =
            "Unable to load GitHub README: " + error.message;
    }
}

loadREADME();
</script>

</body>
</html>
