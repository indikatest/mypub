<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — MS-Micro</title>
    <meta name="description" content="Log in to your MS-Micro developer account." />
    <style>
        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #142033;
            --muted: #748094;
            --line: #d9dee7;
            --navy: #07111f;
            --primary: #5f8cff;
            --accent: #4de2c5;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 8%, rgba(95,140,255,0.12), transparent 30%),
                radial-gradient(circle at 88% 15%, rgba(77,226,197,0.10), transparent 28%),
                var(--bg);
        }

        a { color: inherit; }

        .topbar {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            width: min(calc(100% - 32px), 980px);
            margin: 0 auto;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--navy);
            text-decoration: none;
            font-weight: 850;
            letter-spacing: -0.03em;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: linear-gradient(135deg, #8aaaff, var(--accent));
            color: var(--navy);
            font-size: 0.75rem;
            font-weight: 900;
        }

        .signup-link {
            color: #42506a;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .signup-link strong { color: var(--navy); }

        .page {
            width: min(calc(100% - 24px), 440px);
            margin: 72px auto 56px;
        }

        .card {
            padding: 32px 28px;
            border: 1px solid rgba(7,17,31,0.10);
            border-radius: 26px;
            background: var(--card);
            box-shadow: 0 24px 70px rgba(17,31,52,0.12);
        }

        .kicker {
            margin-bottom: 8px;
            color: #53627a;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--navy);
            font-size: 1.85rem;
            line-height: 1.1;
            letter-spacing: -0.04em;
        }

        .intro {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 0.91rem;
            line-height: 1.55;
        }

        .field { margin-bottom: 15px; }

        .field label {
            display: block;
            margin: 0 0 6px 4px;
            color: #58657a;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .input-shell {
            min-height: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 15px;
            border: 1px solid var(--line);
            border-radius: 25px;
            background: #fbfcfe;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-shell:focus-within {
            border-color: rgba(95,140,255,0.65);
            box-shadow: 0 0 0 3px rgba(95,140,255,0.10);
        }

        .input-shell input {
            min-width: 0;
            flex: 1;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--navy);
            font: inherit;
            font-size: 0.94rem;
        }

        .input-shell input::placeholder { color: #a0a8b6; }

        .password-toggle {
            border: 0;
            padding: 3px 0;
            background: transparent;
            color: #57647a;
            cursor: pointer;
            font-size: 0.74rem;
            font-weight: 700;
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin: 8px 4px 22px;
            color: #748094;
            font-size: 0.76rem;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .forgot {
            color: var(--navy);
            font-weight: 750;
            text-decoration: none;
        }

        .submit {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 25px;
            background: var(--navy);
            color: #ffffff;
            cursor: pointer;
            font-size: 0.92rem;
            font-weight: 800;
            transition: transform 0.2s ease;
        }

        .submit:hover { transform: translateY(-1px); }

        .bottom-link {
            margin: 20px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
            text-align: center;
        }

        .bottom-link a {
            color: var(--navy);
            font-weight: 800;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            color: #66738a;
            font-size: 0.8rem;
            text-align: center;
            text-decoration: none;
        }

        @media (max-width: 520px) {
            .card { padding: 26px 18px; }
            .page { margin-top: 38px; }
            .topbar { min-height: 60px; }
            h1 { font-size: 1.65rem; }
        }
    </style>
</head>
<body>

<header class="topbar">
    <a class="brand" href="index.html">
        <span class="brand-icon">MS</span>
        <span>MS-Micro</span>
    </a>

    <a class="signup-link" href="signup.html">
        New here? <strong>Sign Up</strong>
    </a>
</header>

<main class="page">
    <section class="card" aria-labelledby="login-title">
        <div class="kicker">Developer Account</div>
        <h1 id="login-title">Log in to MS-Micro</h1>
        <p class="intro">Access your developer license, trial and account settings.</p>

        <form action="#" method="post">
            <div class="field">
                <label for="email">Email address</label>
                <div class="input-shell">
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-shell">
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required />
                    <button class="password-toggle" type="button">Show</button>
                </div>
            </div>

            <div class="login-options">
                <label class="remember">
                    <input type="checkbox" name="remember" />
                    Remember me
                </label>

                <a class="forgot" href="#">Forgot password?</a>
            </div>

            <button class="submit" type="submit">Log In</button>
        </form>

        <p class="bottom-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
    </section>

    <a class="back-link" href="index.html">← Back to MS-Micro</a>
</main>

<script>
    const password = document.getElementById("password");
    const toggle = document.querySelector(".password-toggle");

    toggle.addEventListener("click", () => {
        const showPassword = password.type === "password";
        password.type = showPassword ? "text" : "password";
        toggle.textContent = showPassword ? "Hide" : "Show";
    });
</script>

</body>
</html>
